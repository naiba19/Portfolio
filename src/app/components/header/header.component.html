<header class="header" [class.menu-open]="menuOpen">
      <div class="header-container">
        <div class="logo">
          <button class="logo-text" (click)="scrollToHome()" [attr.aria-label]="'header.logo' | translate">[NR]</button>
        </div>
        
        <div class="header-right">
          <div class="language-toggle">
            <button 
              type="button"
              (click)="setLanguage('en')" 
              class="lang-button"
              [class.active]="currentLanguage === 'en'"
              [attr.aria-label]="'header.switchEnglish' | translate"
              [attr.aria-pressed]="currentLanguage === 'en'"
            >
              EN
            </button>
            <button 
              type="button"
              (click)="setLanguage('de')" 
              class="lang-button"
              [class.active]="currentLanguage === 'de'"
              [attr.aria-label]="'header.switchGerman' | translate"
              [attr.aria-pressed]="currentLanguage === 'de'"
            >
              DE
            </button>
          </div>

          <button 
            type="button"
            class="hamburger-menu"
            [class.open]="menuOpen"
            (click)="toggleMenu()"
            [attr.aria-label]="menuOpen ? ('header.closeMenu' | translate) : ('header.openMenu' | translate)"
            [attr.aria-expanded]="menuOpen"
            aria-controls="navigation-menu"
          >
            <span class="hamburger-line line1"></span>
            <span class="hamburger-line line2"></span>
            <span class="hamburger-line line3"></span>
          </button>
        </div>
      </div>

      <!-- Overlay Menu -->
      <div
        id="navigation-menu"
        class="menu-overlay"
        [class.open]="menuOpen"
        (click)="closeMenu()"
      >
        <nav class="menu-content" [attr.aria-label]="'header.navigation' | translate" (click)="$event.stopPropagation()">
          <button type="button" class="menu-item" (click)="navigateTo('about')">{{ 'nav.about' | translate }}</button>
          <button type="button" class="menu-item" (click)="navigateTo('skills')">{{ 'nav.skills' | translate }}</button>
          <button type="button" class="menu-item" (click)="navigateTo('portfolio')">{{ 'nav.portfolio' | translate }}</button>
        </nav>

        <div class="menu-footer" (click)="$event.stopPropagation()">
          <div class="menu-footer-content">
            <div class="menu-contact">
              <a class="menu-say-hi" href="mailto:naiba.radshabov@outlook.de">{{ 'header.sayHi' | translate }}</a>
              <a class="menu-email" href="mailto:naiba.radshabov@outlook.de">
                naiba.radshabov@outlook.de
              </a>
            </div>

            <div class="menu-socials" [attr.aria-label]="'header.socialLinks' | translate">
              <a href="https://github.com/naiba19" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'header.github' | translate">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .08 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.64-1.36-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.74-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.98c.85 0 1.71.12 2.51.34 1.91-1.32 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.71 1.03 1.62 1.03 2.74 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.36-.01 2.46-.01 2.79 0 .27.18.59.69.49A10.1 10.1 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"/>
                </svg>
              </a>
              <a href="mailto:naiba.radshabov@outlook.de" [attr.aria-label]="'header.email' | translate">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>
                  <path d="m4 6 8 7 8-7" fill="none" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </a>
              <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'header.linkedin' | translate">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5.4 7.7A2.3 2.3 0 1 0 5.4 3a2.3 2.3 0 0 0 0 4.7ZM3.5 21h3.8V9.2H3.5V21Zm6.1 0h3.8v-6.5c0-1.7.3-3.4 2.5-3.4 2.1 0 2.1 2 2.1 3.5V21h3.8v-7.1c0-3.5-.8-6.1-4.8-6.1-1.9 0-3.2 1-3.7 2h-.1V9.2H9.6V21Z"/>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>
