<section class="about">
  <div class="about-container">
    <h2 class="about-title">{{ 'about.title' | translate }}</h2>

    <div class="about-content">
      <div class="about-text">
        <p class="about-intro">
          {{ 'about.intro' | translate }}
        </p>

        <p class="about-details">
          {{ 'about.details' | translate }}
        </p>

        <div class="about-info">
          <p class="about-info-item">
            <img src="./icons/location.svg" alt="" aria-hidden="true">
            <span><strong>{{ 'about.location' | translate }}</strong> {{ 'about.locationValue' | translate }}</span>
          </p>
          <p class="about-info-item">
            <img src="./icons/remote.svg" alt="" aria-hidden="true">
            <span><strong>{{ 'about.status' | translate }}</strong> {{ 'about.statusValue' | translate }}</span>
          </p>
        </div>
        <button type="button" class="about-talk" (click)="scrollToContact()">{{ 'about.talk' | translate }}</button>
      </div>

      <div class="about-image-frame">
        <div class="image-placeholder">
          <img src="self-portrait.jpg" alt="Naiba Radshabov" loading="lazy">
        </div>
      </div>
    </div>

    <button type="button" class="about-skills-arrow" (click)="scrollToSkills()" [attr.aria-label]="'about.scrollToSkills' | translate">
      <img src="./arrows/right-skills.svg" alt="">
    </button>
  </div>
</section>
