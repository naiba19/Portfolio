<section class="skills">
  <div class="skills-container">
    <h2 class="skills-title">{{ 'skills.title' | translate }}</h2>

    <div class="skills-frame">
      <div class="skills-grid">
        <div *ngFor="let skill of skills; let i = index" class="skill-item">
          <div class="skill-icon-wrap" 
               (mouseenter)="onIconMouseEnter(i)" 
               (mouseleave)="onIconMouseLeave(i)"
               (animationend)="onIconMouseLeave(i)"
               [class.animating]="isAnimating(i)">
            <div class="skill-icon-art">
              <img class="skill-icon" [src]="isAnimating(i) && skill.iconColored ? skill.iconColored : skill.icon" [alt]="skill.label" loading="lazy">
            </div>
          </div>
          <p class="skill-label">{{ skill.label }}</p>
        </div>
      </div>

      <div class="skills-message">
        <div class="education-icon" aria-hidden="true">
          <img src="/skills/growth_mindset.svg" alt="">
        </div>
        <p>Don't see the skill you need?</p>
        <a href="mailto:naiba.radshabov@outlook.de" class="contact-link">
          {{ 'skills.contact' | translate }}
        </a>
        <p>I'm always ready to learn!</p>
      </div>
    </div>
  </div>

  <div class="skills-arrow-container">
    <button type="button" class="skills-portfolio-arrow" (click)="scrollToPortfolio()" [attr.aria-label]="'skills.scrollToPortfolio' | translate">
      <img src="/arrows/left.svg" alt="">
    </button>
  </div>
</section>
